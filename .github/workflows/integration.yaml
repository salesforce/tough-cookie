name: Integration

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '00 01 * * 1' # at 1:00 on mondays

permissions:
  contents: read

defaults:
  run:
    # Setting an explicit bash shell ensures GitHub Actions enables pipefail mode too,
    # rather than only error on exit (improving failure UX when pipes are used). See:
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    shell: bash

jobs:
  integration-with-canvas:
    name: Integration (jsdom + node-canvas)
    runs-on: ubuntu-latest
    env:
      TEST_SUITE: 'node-canvas'
    steps:
      - uses: actions/checkout@v5
        with:
          path: ./tough-cookie
      - uses: actions/checkout@v5
        with:
          repository: jsdom/jsdom
          ref: main
          path: ./jsdom
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install required image manipulation packages with APT
        run: sudo apt-get update && sudo apt-get install build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Build tough-cookie
        id: package
        run: |
          npm ci
          npm run build
          echo "tough_cookie_tarball=$(npm pack | tail -1)" >> "$GITHUB_OUTPUT"
        working-directory: ./tough-cookie
      - name: Setup HOSTS file for Web Platform Test server
        run: ./test/web-platform-tests/tests/wpt make-hosts-file | sudo tee -a /etc/hosts
        working-directory: ./jsdom
      - name: Install jsdom dependencies
        run: |
          npm ci
          npm uninstall tough-cookie
          npm install ../tough-cookie/${{ steps.package.outputs.tough_cookie_tarball }}
          npm install canvas@3
        working-directory: ./jsdom
      - name: Update jsdom WPT expectations
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'test/web-platform-tests/to-run.yaml'
          const failure = '[fail, fetch not implemented and cookie prefix handling is incomplete]'
          const from = `prefix/**: ${failure}`
          const to = from.replace('prefix/**:', 'prefix/!(__host.explicit-path.https.window.html):')
          writeFileSync(path, readFileSync(path, 'utf8').replace(from, to))
          NODE
        working-directory: ./jsdom
      - name: Run tests
        run: npm test
        working-directory: ./jsdom
  integration:
    name: Integration (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ./tough-cookie
      - uses: actions/checkout@v5
        with:
          repository: jsdom/jsdom
          ref: main
          path: ./jsdom
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Build tough-cookie
        id: package
        run: |
          npm ci
          npm run build
          echo "tough_cookie_tarball=$(npm pack | tail -1)" >> "$GITHUB_OUTPUT"
        working-directory: ./tough-cookie
      - name: Setup HOSTS file for Web Platform Test server
        run: ./test/web-platform-tests/tests/wpt make-hosts-file | sudo tee -a /etc/hosts
        working-directory: ./jsdom
      - name: Install jsdom dependencies
        run: |
          npm ci
          npm uninstall tough-cookie
          npm install ../tough-cookie/${{ steps.package.outputs.tough_cookie_tarball }}
        working-directory: ./jsdom
      - name: Update jsdom WPT expectations
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'test/web-platform-tests/to-run.yaml'
          const failure = '[fail, fetch not implemented and cookie prefix handling is incomplete]'
          const from = `prefix/**: ${failure}`
          const to = from.replace('prefix/**:', 'prefix/!(__host.explicit-path.https.window.html):')
          writeFileSync(path, readFileSync(path, 'utf8').replace(from, to))
          NODE
        working-directory: ./jsdom
      - name: Run tests
        run: npm run test
        working-directory: ./jsdom
